<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Desk</title><link rel="stylesheet" href="/console.css"></head>
<body><header><div><strong>Support Desk</strong><span>客服处理台</span></div><span class="header-status">STAFF CONSOLE</span></header>
<main><div class="heading"><h1>咨询处理</h1><div class="auth"><label for="token">员工令牌</label><input id="token" type="password" autocomplete="off" placeholder="输入令牌"><button id="connect">连接</button></div></div><p id="error" role="alert" hidden></p>
<div class="layout"><section class="inquiry"><h2>新咨询</h2><form id="ask-form"><label for="order-id">订单编号</label><input id="order-id" required placeholder="ORD-100"><label for="question">客户问题</label><textarea id="question" required minlength="3" placeholder="输入客户的具体问题"></textarea><button>查询并处理</button></form><div id="answer" class="answer" hidden></div></section>
<section class="tickets"><div class="section-head"><h2>待人工处理</h2><button id="refresh" class="secondary">刷新</button></div><div id="ticket-list" class="ticket-list"><p class="muted">连接后显示工单</p></div></section></div>
<div class="layout lower"><section><h2>订单资料</h2><form id="order-form" class="stack"><input id="new-order-id" required placeholder="订单编号"><input id="order-status" required placeholder="当前状态"><input id="order-note" placeholder="备注"><button>保存订单</button></form><div id="order-list" class="record-list"></div></section><section><h2>政策资料</h2><form id="policy-form" class="stack"><input id="policy-title" required placeholder="政策名称"><textarea id="policy-body" required minlength="10" placeholder="政策正文"></textarea><button>新增政策</button></form><div id="policy-list" class="record-list"></div></section></div></main><script src="/console.js"></script></body></html>
